<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            zomato
        </div>
        <div class="location">
            jaipur
        </div>
        <a href="login.html" class="login-btn">Login</a>

    </header>
    <div class="search">
        <span class="search-icon">🔎</span>
        <input type="text"
        id="searchInput"
         placeholder="search for restaurant,cuisine or dish">
    </div>

    <section class="categories">
        <h2>Inspiration for your first order</h2>

        <div class="food-card" data-name="pizza">
            <img src="pizza.jpg">
            <p>Pizza</p>
            <span class="price">₹299</span>
        </div>

         <div class="food-card" data-name="Biryani">
            <img src="biryani.jpg">
            <p>Biryani</p>
            <span class="price">₹199</span>
        </div>

         <div class="food-card" data-name="Burger">
            <img src="Burger.jpg">
            <p>Burger</p>
            <span class="price">₹149</span>
        </div>

         <div class="food-card">
            <img src="veg.jpg">
            <p>Veg Meal</p>
            <span class="price">₹99</span>
        </div>

         <div class="food-card">
            <img src="thali.jpg">
            <p>Thali</p>
            <span class="price">₹129</span>
        </div>

         <div class="food-card">
            <img src="cake.jpg">
            <p>Cake</p>
            <span class="price">₹159</span>
        </div>

         <div class="food-card">
            <img src="chicken.jpg">
            <p>Chicken</p>
            <span class="price">₹179</span>
        </div>

    </section>

    <section class="brands">
        <h2>Top brands for you</h2>

        <div class="brand-card">
            <div class="brand-logo">
                   <img src="kfc.png">
            </div>
            <p>KFC</p>
        </div>

         <div class="brand-card">
            <div class="brand-logo">
                <img src="burgerking.png">
            </div>
            <p>Burger King</p>
        </div>

         <div class="brand-card">
            <div class="brand-logo">
                   <img src="mcdonalds.png">
            </div>
            <p>McDonald's</p>
        </div>

         <div class="brand-card">
            <div class="brand-logo">
                   <img src="dominos.png">
            </div>
            <p>Domino's pizza</p>
        </div>

    </section>
    <section class="offer">
        <h2>Unlock exclusive offers</h2>

        <p>Enjoy exciting offers on ordering from the app</p>

        <button>Use App</button>
        

        <div class="offer-image">
            🎁
        </div>
    </section>

    <script src="script.js"></script>
    
</body>
</html>
